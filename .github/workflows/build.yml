name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download ZipDepth model and pin input shape
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail -o /tmp/zipdepth_orig.onnx \
            https://huggingface.co/Jens-Duttke/ZipDepth-ONNX/resolve/main/zipdepth_fp16_opset17.onnx
          test $(stat -c%s /tmp/zipdepth_orig.onnx) -gt 5000000
          pip install onnx onnxruntime
          python -m onnxruntime.tools.make_dynamic_shape_fixed \
            --input_name pixel_values --input_shape 1,3,512,512 \
            /tmp/zipdepth_orig.onnx app/src/main/assets/zipdepth.onnx \
            || cp /tmp/zipdepth_orig.onnx app/src/main/assets/zipdepth.onnx
          ls -la app/src/main/assets

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: DepthParallax-debug
          path: app/build/outputs/apk/debug/*.apk
