name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download MiDaS small model
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail -o app/src/main/assets/midas_small.tflite \
            https://github.com/isl-org/MiDaS/releases/download/v2_1/model_opt.tflite
          ls -la app/src/main/assets

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: DepthParallax-debug
          path: app/build/outputs/apk/debug/*.apk
